<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="404 Page Not Found — Prajwal Bharad FinTech & Analytics Portfolio">
  <title>404 Page Not Found | Prajwal Bharad</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2307110f'/><text x='50' y='68' font-family='sans-serif' font-size='55' font-weight='bold' fill='%23b9f227' text-anchor='middle'>PB</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      position: relative;
      z-index: 10;
    }
    .error-code {
      font-family: var(--serif);
      font-size: clamp(80px, 15vw, 160px);
      font-weight: 800;
      color: var(--green);
      line-height: 1;
      margin: 0;
      text-shadow: 0 0 40px rgba(185, 242, 39, 0.2);
    }
    .error-title {
      font-family: var(--serif);
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 700;
      margin: 16px 0 12px;
      color: #ffffff;
    }
    .error-copy {
      max-width: 480px;
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 32px;
    }
    .error-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 14.5px;
      transition: all 0.2s ease;
    }
    .error-btn-primary {
      background: var(--green);
      color: #07110f;
    }
    .error-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(185, 242, 39, 0.3);
    }
    .error-btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      border: 1px solid var(--line);
    }
    .error-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <main class="error-shell">
    <span class="error-code">404</span>
    <h1 class="error-title">Destination Not Found</h1>
    <p class="error-copy">The page or resource you are looking for might have been moved, renamed, or is temporarily unavailable.</p>
    <div class="error-actions">
      <a class="error-btn error-btn-primary" href="index.html">← Return to Portfolio</a>
      <a class="error-btn error-btn-secondary" href="wealth-os.html">Open Wealth OS ↗</a>
    </div>
  </main>
</body>
</html>
